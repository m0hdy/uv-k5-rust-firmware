[package]
name = "uv-k5-rust-firmware"
version = "0.1.0"
edition = "2024"
publish = false
license = "ISC AND Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "uv-k5-rust-firmware"
path = "src/bin/firmware.rs"
test = false
bench = false

[[bin]]
name = "mixed-fallback"
path = "src/bin/mixed_fallback.rs"
test = false
bench = false
required-features = ["mixed-fallback"]

[features]
firmware-integration = []
mixed-fallback = []
mixed-fallback-c = ["mixed-fallback"]
mixed-fallback-rust = ["mixed-fallback"]

[profile.release]
panic = "abort"
