name: Bug report
description: Report a reproducible problem in the project
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to report security vulnerabilities; see [SECURITY.md](../../SECURITY.md).
        Do not include serial numbers, EEPROM/calibration dumps, credentials, or other sensitive device data.
  - type: input
    id: radio_model
    attributes:
      label: Radio model
      description: Include the model (for example, UV-K5(8)); write "Unknown" if you cannot identify it.
    validations:
      required: true
  - type: input
    id: radio_revision
    attributes:
      label: Radio / board revision
      description: Include the hardware revision if known; otherwise write "Unknown".
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Firmware version or commit
      description: Identify the version or source commit you built or tested; write "Unknown" if unavailable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add only redacted logs or other non-sensitive details.
    validations:
      required: false
